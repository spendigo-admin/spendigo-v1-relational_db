name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build

      # Note: Actual deployment requires FIREBASE_TOKEN secret
      # - name: Deploy to Firebase
      #   uses: firebase/firebase-tools@latest
      #   with:
      #     args: deploy --token ${{ secrets.FIREBASE_TOKEN }}
